@if (node?.colors) {
  <div class="colors-panel">
    <!-- lernkit: Tippen auf den Hintergrund schließt den Farbwähler auch auf iPad/iPhone
         (iOS meldet dort kein mousedown auf nicht klickbaren Flächen). -->
    <div
      #background
      class="background"
      (pointerdown)="closePickers($event)"></div>

    <div class="panel">
      <input
        readonly
        (colorPickerChange)="colorPickerChange('backgroundColor', $event)"
        (cpToggleChange)="
          colorPickerToggleChange(
            $event,
            'backgroundColor',
            node.colors.background
          )
        "
        [(colorPicker)]="node.colors.background"
        [cpPositionOffset]="'-500%'"
        [cpPresetColors]="options.presetColors"
        [cpPresetLabel]="''"
        [cpDisableInput]="true"
        [cpWidth]="options.width"
        [style.background]="node.colors.background"
        [title]="'TOOLTIPS.NODE_COLOR' | translate"
        class="background-color"
        cpPosition="left"
        [disabled]="editDisabled" />
      <input
        readonly
        (colorPickerChange)="colorPickerChange('nameColor', $event)"
        (cpToggleChange)="
          colorPickerToggleChange($event, 'nameColor', node.colors.name)
        "
        [(colorPicker)]="node.colors.name"
        [cpPositionOffset]="'-500%'"
        [cpPresetColors]="options.presetColors"
        [cpPresetLabel]="''"
        [cpDisableInput]="true"
        [cpWidth]="options.width"
        [style.background]="node.colors.name"
        [title]="'TOOLTIPS.TEXT_COLOR' | translate"
        class="text-color"
        cpPosition="left"
        [disabled]="editDisabled" />
      @if (node.colors.branch) {
        <input
          readonly
          (colorPickerChange)="colorPickerChange('branchColor', $event)"
          (cpToggleChange)="
            colorPickerToggleChange($event, 'branchColor', node.colors.branch)
          "
          [(colorPicker)]="node.colors.branch"
          [cpPositionOffset]="'-500%'"
          [cpPresetColors]="options.presetColors"
          [cpPresetLabel]="''"
          [cpDisableInput]="true"
          [cpWidth]="options.width"
          [style.background]="node.colors.branch"
          [title]="'TOOLTIPS.BRANCH_COLOR' | translate"
          class="branch-color"
          cpPosition="left"
          [disabled]="editDisabled" />
      }
    </div>
  </div>
}
