<h2 mat-dialog-title>{{ applicationName }} {{ version }}</h2>
<mat-dialog-content>
  <div class="about-modal-section">
    <img
      src="./assets/icons/lernkit-mindmap.svg"
      width="72"
      alt="lernkit Mindmap" />
    {{ 'PAGES.ABOUT.INTRODUCTION.APPLICATION_DESCRIPTION' | translate }}
  </div>
  <br />
  <div class="about-modal-section lk-about-meta">
    <div class="hint-box">
      {{ 'MODALS.INFO.DELETION_MOVED' | translate }}
    </div>
    <div class="lk-about-links">
      <a
        href="https://github.com/b310-digital/teammapper"
        target="_blank"
        rel="noopener">
        <fa-icon [icon]="faGithub"></fa-icon>&nbsp;GitHub
      </a>
      <span aria-hidden="true">·</span>
      <a
        href="https://badges.lernkit.de/impressum"
        target="_blank"
        rel="noopener"
        >Impressum</a
      >
      <span aria-hidden="true">·</span>
      <a
        href="https://badges.lernkit.de/datenschutz"
        target="_blank"
        rel="noopener"
        >Datenschutz</a
      >
    </div>
  </div>
  <section class="about-modal-section shortcuts-section">
    <h3>{{ 'MODALS.INFO.SHORTCUTS_TITLE' | translate }}</h3>
    <teammapper-shortcut-list></teammapper-shortcut-list>
  </section>
</mat-dialog-content>
<mat-dialog-actions class="lk-about-actions">
  <button mat-flat-button color="primary" [mat-dialog-close]="true">
    {{ 'MODALS.GENERAL.BUTTON_CLOSE' | translate }}
  </button>
</mat-dialog-actions>
